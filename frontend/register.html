
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forensic Sketch Matching - Professional Registration</title>
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Added for better visibility of messages */
        #debugInfo {
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: monospace;
            display: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-[#f4f6f7]">
    <div class="w-full max-w-xl">
        <div class="bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-200">
            <div class="bg-[#2c3e50] p-6 text-center">
                <h2 class="text-3xl font-bold text-white">Professional Registration</h2>
                <p class="text-[#95a5a6] mt-2">Create your Forensic Sketch Matching Account</p>
            </div>
            
            <div class="p-8">
                <form id="registerForm" class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-[#2c3e50] mb-2">First Name</label>
                            <input 
                                type="text" 
                                id="firstName" 
                                required 
                                class="w-full px-4 py-3 rounded-lg border border-[#bdc3c7] focus:outline-none focus:ring-2 focus:ring-[#3498db] transition duration-300"
                                placeholder="Enter first name"
                            >
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-[#2c3e50] mb-2">Last Name</label>
                            <input 
                                type="text" 
                                id="lastName" 
                                required 
                                class="w-full px-4 py-3 rounded-lg border border-[#bdc3c7] focus:outline-none focus:ring-2 focus:ring-[#3498db] transition duration-300"
                                placeholder="Enter last name"
                            >
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-[#2c3e50] mb-2">Professional Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            required 
                            class="w-full px-4 py-3 rounded-lg border border-[#bdc3c7] focus:outline-none focus:ring-2 focus:ring-[#3498db] transition duration-300"
                            placeholder="your.email@forensics.org"
                        >
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-[#2c3e50] mb-2">Forensic Professional ID</label>
                        <input 
                            type="text" 
                            id="forensicId" 
                            required 
                            class="w-full px-4 py-3 rounded-lg border border-[#bdc3c7] focus:outline-none focus:ring-2 focus:ring-[#3498db] transition duration-300"
                            placeholder="FP-XXXX-YYYY"
                        >
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-[#2c3e50] mb-2">Department</label>
                        <select 
                            id="department" 
                            required 
                            class="w-full px-4 py-3 rounded-lg border border-[#bdc3c7] focus:outline-none focus:ring-2 focus:ring-[#3498db] transition duration-300"
                        >
                            <option value="">Select Your Department</option>
                            <option value="local-police">Local Police Department</option>
                            <option value="state-police">State Police Bureau</option>
                            <option value="cid">Criminal Investigation Department</option>
                            <option value="forensic-lab">National Forensic Laboratory</option>
                            <option value="national-agency">National Investigation Agency</option>
                            <option value="other">Other Law Enforcement Agency</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <!-- Password Field -->
                        <div class="relative">
                            <label class="block text-sm font-semibold text-[#2c3e50] mb-2">Password</label>
                            <input 
                                type="password" 
                                id="password" 
                                required 
                                class="w-full px-4 py-3 rounded-lg border border-[#bdc3c7] focus:outline-none focus:ring-2 focus:ring-[#3498db] transition duration-300"
                                placeholder="Create strong password"
                            >
                            <button type="button" 
                                    id="togglePassword" 
                                    class="absolute right-3 top-10 text-[#7f8c8d] hover:text-[#2c3e50] focus:outline-none">
                                👁️
                            </button>
                        </div>
                    
                        <!-- Confirm Password Field -->
                        <div class="relative">
                            <label class="block text-sm font-semibold text-[#2c3e50] mb-2">Confirm Password</label>
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                required 
                                class="w-full px-4 py-3 rounded-lg border border-[#bdc3c7] focus:outline-none focus:ring-2 focus:ring-[#3498db] transition duration-300"
                                placeholder="Repeat password"
                            >
                            <button type="button" 
                                    id="toggleConfirmPassword" 
                                    class="absolute right-3 top-10 text-[#7f8c8d] hover:text-[#2c3e50] focus:outline-none">
                                👁️
                            </button>
                        </div>
                    </div>
                    

                    <div class="flex items-center">
                        <input 
                            type="checkbox" 
                            id="termsCheckbox" 
                            required
                            class="h-4 w-4 text-[#3498db] focus:ring-[#3498db] border-[#bdc3c7] rounded"
                        >
                        <label for="termsCheckbox" class="ml-2 block text-sm text-[#34495e]">
                            I agree to the Terms of Service Code of Conduct
                        </label>
                    </div>

                    <button 
                        type="submit" 
                        class="w-full bg-[#2c3e50] text-white py-3 rounded-lg hover:bg-[#34495e] transition duration-300 font-semibold text-lg"
                    >
                        Create Professional Account
                    </button>

                    <div class="text-center">
                        <a href="login.html" class="text-[#3498db] hover:underline text-sm">
                            Already have an account? Login
                        </a>
                    </div>
                </form>

                <div id="errorMessage" class="text-red-500 text-center mt-4 hidden"></div>
                <div id="debugInfo"></div>
            </div>
        </div>
    </div>

    <script>
        // Enhanced Debugging Function
        function debugLog(message) {
            const debugInfo = document.getElementById('debugInfo');
            debugInfo.style.display = 'block';
            debugInfo.textContent += message + '\n';
            console.log(message);
        }

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyALf2B9y_y8-krVEwBXEC5zwfzcDyJBLRc",
            authDomain: "facetrace-a3b02.firebaseapp.com",
            projectId: "facetrace-a3b02",
            storageBucket: "facetrace-a3b02.firebasestorage.app",
            messagingSenderId: "688778782116",
            appId: "1:688778782116:web:11408102540d8518534d31"
        };

        // Initialize Firebase with error handling
        try {
            firebase.initializeApp(firebaseConfig);
            // debugLog('Firebase initialized successfully');
        } catch (initError) {
            debugLog('Firebase initialization error: ' + initError.message);
        }
        
        // Initialize Firestore
        const db = firebase.firestore();

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous debug info
            document.getElementById('debugInfo').textContent = '';
           

            // Collect form data
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const forensicId = document.getElementById('forensicId').value;
            const department = document.getElementById('department').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMessage = document.getElementById('errorMessage');

            // Reset error message
            errorMessage.textContent = '';
            errorMessage.classList.add('hidden');

            // Validation checks
            if (password !== confirmPassword) {
                debugLog('Password mismatch');
                errorMessage.textContent = 'Passwords do not match';
                errorMessage.classList.remove('hidden');
                return;
            }

            // Password strength check
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_])[a-zA-Z\d\W_]{8,}$/;
            if (!passwordRegex.test(password)) {
                debugLog('Weak password');
                errorMessage.textContent = 'Password must be 8+ chars, with uppercase, lowercase, and numbers';
                errorMessage.classList.remove('hidden');
                return;
            }

            
                
                // Create user in Firebase Authentication
                const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                

                try {
                    // Save additional user details to Firestore
                    await db.collection('users').doc(user.uid).set({
                        firstName: firstName,
                        lastName: lastName,
                        email: email,
                        forensicId: forensicId,
                        department: department,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        role: 'professional'
                        
                    });
                    

                // Explicitly show success (for debugging)
                alert('Account registered successfully! Redirecting to login.');
                
                // Redirect to login page
                window.location.href = 'login.html';

            } catch (error) {
                // Detailed error logging
                debugLog('Registration Error: ' + error.message);
                debugLog('Error Code: ' + error.code);
                
                let errorText = 'Registration failed. Please try again.';
                
                switch(error.code) {
                    case 'auth/email-already-in-use':
                        errorText = 'Email is already registered. Please use a different email.';
                        break;
                    case 'auth/invalid-email':
                        errorText = 'Invalid email address format.';
                        break;
                    case 'auth/weak-password':
                        errorText = 'Password is too weak. Please choose a stronger password.';
                        break;
                }

                // Display error message
                errorMessage.textContent = errorText;
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
