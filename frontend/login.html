
<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Login - Forensic Sketch Matching</title>  
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>  
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>  
    <script src="https://cdn.tailwindcss.com"></script>  
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f7;
        }
    </style>
</head>  
<body class="flex items-center justify-center min-h-screen p-4">  
    <div class="w-full max-w-xl">
        <div class="bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-200">
            <div class="bg-[#2c3e50] p-6 text-center">
                <h2 class="text-3xl font-bold text-white">Professional Login</h2>
                <p class="text-[#95a5a6] mt-2">Access Forensic Sketch Matching Platform</p>
            </div>
            
            <div class="p-8">
                <form id="loginForm" class="space-y-6">  
                    <div>  
                        <label class="block text-sm font-semibold text-[#2c3e50] mb-2">Professional Email</label>  
                        <input   
                            type="email"   
                            id="email"   
                            required   
                            class="w-full px-4 py-3 rounded-lg border border-[#bdc3c7] focus:outline-none focus:ring-2 focus:ring-[#3498db] transition duration-300"
                            placeholder="your.email@forensics.org"
                        >  
                    </div>  
                    
                    <div>  
                        <label class="block text-sm font-semibold text-[#2c3e50] mb-2">Password</label>  
                        <input   
                            type="password"   
                            id="password"   
                            required   
                            class="w-full px-4 py-3 rounded-lg border border-[#bdc3c7] focus:outline-none focus:ring-2 focus:ring-[#3498db] transition duration-300"
                            placeholder="Enter your password"
                        >  
                    </div>  
                    
                    <div>  
                        <button   
                            type="submit"   
                            class="w-full bg-[#2c3e50] text-white py-3 rounded-lg hover:bg-[#34495e] transition duration-300 font-semibold text-lg"
                        >  
                            Login  
                        </button>  
                    </div>  
                    
                    <div class="text-center">  
                        <a href="register.html" class="text-[#3498db] hover:underline text-sm">  
                            Create an account/Register 
                        </a>  
                    </div>  
                </form>  
                
                <div id="errorMessage" class="text-red-500 text-center mt-4 hidden"></div>  
            </div>
        </div>
    </div>

    <script>  
        // Firebase Configuration  
        const firebaseConfig = {  
            apiKey: "AIzaSyALf2B9y_y8-krVEwBXEC5zwfzcDyJBLRc",  
            authDomain: "facetrace-a3b02.firebaseapp.com",  
            projectId: "facetrace-a3b02",  
            storageBucket: "facetrace-a3b02.firebasestorage.app",  
            messagingSenderId: "688778782116",  
            appId: "1:688778782116:web:11408102540d8518534d31"  
        };  

        // Initialize Firebase  
        firebase.initializeApp(firebaseConfig);  

        document.getElementById('loginForm').addEventListener('submit', async (e) => {  
            e.preventDefault();  
            const email = document.getElementById('email').value;  
            const password = document.getElementById('password').value;  
            const errorMessage = document.getElementById('errorMessage');  

            try {  
                // Firebase Authentication  
                const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);  
                
                // Successful login  
                errorMessage.textContent = '';  
                errorMessage.classList.add('hidden');  
                
                // Redirect to main application  
                window.location.href = 'sketch_generator.html';  
            } catch (error) {  
                // Handle Errors  
                errorMessage.textContent = error.message;  
                errorMessage.classList.remove('hidden');  
            }  
        });  
    </script>  
</body>  
</html>
